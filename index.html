let currentUser = null;
let currentPw = '';
const picks = new Map();
let refreshers = [];

function doLogin() {
  const pw = document.getElementById('password-input').value.trim();
  const err = document.getElementById('login-error');
  if(USERS[pw]) {
    currentUser = USERS[pw];
    currentPw = pw;
    err.textContent = '';
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('main-screen').style.display = 'block';
    renderMain();
  } else {
    err.textContent = '密碼錯誤，請再試一次';
  }
}
document.getElementById('password-input').addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

function doLogout() {
  currentUser = null;
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('password-input').value = '';
  document.getElementById('shoe-groups').innerHTML = '';
  picks.clear(); refreshers = [];
  document.getElementById('pick-bar').style.display = 'none';
}

function renderMain() {
  const u = currentUser;
  document.getElementById('user-title').textContent = u.name + ' 的選鞋清單';
  document.getElementById('user-sub').textContent = u.sub;
  const container = document.getElementById('shoe-groups');
  container.innerHTML = '';
  picks.clear(); refreshers = [];
  u.groups.forEach(group => {
    const labelEl = document.createElement('div');
    labelEl.className = 'group-label';
    labelEl.textContent = group.label;
    container.appendChild(labelEl);
    const grid = document.createElement('div');
    grid.className = 'grid';
    group.items.forEach(item => grid.appendChild(makeCard(item)));
    container.appendChild(grid);
  });
  document.getElementById('pick-bar').style.display = 'block';
  updateBar();
}

function makeCard(g) {
  const hasMulti = g.variants.length > 1;
  const card = document.createElement('div');
  card.className = 'card';
  let activeIdx = 0;
  let ready = false;

  const imgWrap = document.createElement('div');
  imgWrap.className = 'card-img-wrap';
  g.variants.forEach((v, i) => {
    const img = document.createElement('img');
    img.className = 'card-img' + (i===0?' active':'');
    img.src = 'images/' + v.img;
    img.alt = g.name;
    img.loading = 'lazy';
    img.onerror = function(){ this.style.display='none'; };
    imgWrap.appendChild(img);
  });
  if(hasMulti) {
    const badge = document.createElement('div');
    badge.className = 'only-badge';
    badge.textContent = '共' + g.variants.length + '色';
    imgWrap.appendChild(badge);
  }
  if(g.smu) {
    const sb = document.createElement('div');
    sb.className = 'smu-badge';
    sb.textContent = 'ABC-MART 獨賣';
    imgWrap.appendChild(sb);
  }
  if(g.note) {
    const nb = document.createElement('div');
    nb.className = 'note-badge';
    nb.textContent = g.note;
    imgWrap.appendChild(nb);
  }
  card.appendChild(imgWrap);

  const body = document.createElement('div');
  body.className = 'card-body';
  body.innerHTML = `<div class="brand">${g.brand}</div><div class="name">${g.name}</div>`;

  const selector = document.createElement('div');
  selector.className = 'color-selector';
  const colorLabel = document.createElement('div');
  colorLabel.className = 'selected-color';
  const modelLabel = document.createElement('div');
  modelLabel.className = 'model';

  const sizesRow = document.createElement('div');
  sizesRow.className = 'sizes-row';
  (g.sizes||[]).forEach(s => {
    const tag = document.createElement('span');
    tag.className = 'size-tag';
    tag.textContent = s;
    sizesRow.appendChild(tag);
  });

  const sizeSel = document.createElement('select');
  sizeSel.className = 'size-select';
  sizeSel.innerHTML = '<option value="">選擇尺寸</option>' + ((g.sizes||[]).length>1 ? g.sizes : sizeOptions((g.sizes||[])[0])).map(s => `<option value="${s}">${s} cm</option>`).join('');

  const pickBtn = document.createElement('button');
  pickBtn.className = 'pick-btn';

  const linkRow = document.createElement('div');
  linkRow.className = 'link-row';

  function refresh() {
    const p = picks.get(g.name);
    if(p) {
      pickBtn.textContent = '✓ 已選（點擊取消）';
      pickBtn.className = 'pick-btn on';
      pickBtn.disabled = false;
      card.classList.add('picked');
    } else {
      card.classList.remove('picked');
      const full = picks.size >= 3;
      pickBtn.className = 'pick-btn';
      pickBtn.disabled = full;
      pickBtn.textContent = full ? '已選滿 3 雙' : '選這雙';
    }
  }
  refreshers.push(refresh);

  function updateActive(idx) {
    activeIdx = idx;
    const v = g.variants[idx];
    imgWrap.querySelectorAll('.card-img').forEach((img,i) => img.classList.toggle('active', i===idx));
    colorLabel.textContent = v.color;
    modelLabel.textContent = v.model;
    linkRow.innerHTML = `<a class="link-btn" href="${v.url}" target="_blank">🔗 查看官網</a>`;
    selector.querySelectorAll('.cs-dot').forEach((d,i) => d.classList.toggle('active', i===idx));
    const p = picks.get(g.name);
    if(p) p.idx = idx;
    if(ready) updateBar();
  }

  g.variants.forEach((v, i) => {
    const dot = document.createElement('div');
    dot.className = 'cs-dot' + (i===0?' active':'');
    dot.style.background = COLOR_MAP[v.color]||'#ccc';
    dot.setAttribute('data-label', v.color);
    if(LIGHT.includes(v.color)) dot.style.boxShadow='inset 0 0 0 1.5px #ccc';
    dot.onclick = () => updateActive(i);
    selector.appendChild(dot);
  });

  sizeSel.onchange = () => {
    sizeSel.classList.remove('need');
    const p = picks.get(g.name);
    if(p) p.size = sizeSel.value;
    updateBar();
  };
  pickBtn.onclick = () => {
    if(picks.has(g.name)) { picks.delete(g.name); }
    else {
      if(!sizeSel.value) { sizeSel.classList.add('need'); sizeSel.focus(); return; }
      picks.set(g.name, { g, idx: activeIdx, size: sizeSel.value });
    }
    updateBar();
  };

  body.appendChild(selector);
  body.appendChild(colorLabel);
  body.appendChild(modelLabel);
  if(g.note) {
    const sn = document.createElement('div');
    sn.className = 'size-note-text';
    sn.textContent = '⚠️ ' + g.note;
    body.appendChild(sn);
  }
  body.appendChild(sizesRow);
  body.appendChild(sizeSel);
  body.appendChild(pickBtn);
  body.appendChild(linkRow);
  card.appendChild(body);
  updateActive(0);
  refresh();
  ready = true;
  return card;
}

function sizeOptions(range) {
  const m = String(range||'').match(/([\d.]+)\s*[~～-]\s*([\d.]+)/);
  if(!m) return sizeOptions('17~24');
  const a = parseFloat(m[1]), b = parseFloat(m[2]);
  const out = [a];
  for(let x = Math.floor(a)+1; x < b; x++) out.push(x);
  if(b > a) out.push(b);
  return out.map(String);
}

function updateBar() {
  refreshers.forEach(f => f());
  const list = document.getElementById('pb-list');
  list.innerHTML = '';
  let i = 0;
  picks.forEach((p, key) => {
    i++;
    const v = p.g.variants[p.idx];
    const row = document.createElement('div');
    row.className = 'pb-item';
    const t = document.createElement('span');
    t.textContent = i + '. ' + p.g.name + '・' + v.color + '・' + (p.size ? '尺寸 ' + p.size : '尚未選尺寸');
    const x = document.createElement('button');
    x.className = 'pb-x'; x.textContent = '✕ 取消';
    x.onclick = () => { picks.delete(key); updateBar(); };
    row.appendChild(t); row.appendChild(x);
    list.appendChild(row);
  });
  document.getElementById('pb-title').textContent = '已選 ' + picks.size + ' / 3 雙';
  const ready = picks.size === 3 && [...picks.values()].every(p => p.size);
  document.getElementById('pb-submit').disabled = !ready;
}

function openConfirm() {
  const list = document.getElementById('cf-list');
  list.innerHTML = '';
  picks.forEach(p => {
    const v = p.g.variants[p.idx];
    const row = document.createElement('div');
    row.className = 'cf-row';
    const img = document.createElement('img');
    img.className = 'cf-img'; img.src = 'images/' + v.img; img.alt = p.g.name;
    img.onerror = function(){ this.style.visibility = 'hidden'; };
    const info = document.createElement('div');
    info.className = 'cf-info';
    info.innerHTML = '<div class="cf-brand"></div><div class="cf-name"></div><div class="cf-meta"></div><div class="cf-size"></div>';
    info.querySelector('.cf-brand').textContent = p.g.brand;
    info.querySelector('.cf-name').textContent = p.g.name;
    info.querySelector('.cf-meta').textContent = v.color + '　' + v.model;
    info.querySelector('.cf-size').textContent = '尺寸 ' + p.size + ' cm';
    row.appendChild(img); row.appendChild(info);
    list.appendChild(row);
  });
  document.getElementById('cf-ok').disabled = false;
  document.getElementById('cf-ok').textContent = '確認送出';
  document.getElementById('confirm-mask').classList.add('open');
}
function closeConfirm() { document.getElementById('confirm-mask').classList.remove('open'); }

async function doSubmit() {
  const msg = document.getElementById('pb-msg');
  const btn = document.getElementById('pb-submit');
  const payload = { name: currentUser.name, pw: currentPw, picks: [...picks.values()].map(p => {
    const v = p.g.variants[p.idx];
    return { brand:p.g.brand, name:p.g.name, color:v.color, model:v.model, size:p.size };
  })};
  const okBtn = document.getElementById('cf-ok');
  if(!SUBMIT_URL) { closeConfirm(); msg.className = 'pb-msg err'; msg.textContent = '尚未設定送出網址，請聯絡活動窗口。'; return; }
  okBtn.disabled = true; okBtn.textContent = '送出中…';
  btn.disabled = true; msg.className = 'pb-msg'; msg.textContent = '送出中…';
  try {
    await fetch(SUBMIT_URL, { method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
    msg.className = 'pb-msg ok';
    msg.textContent = '✓ 已送出！如需修改可直接調整後再送一次，以最後一次為準。';
  } catch(e) {
    msg.className = 'pb-msg err'; msg.textContent = '送出失敗，請檢查網路後再試一次。';
  }
  closeConfirm();
  btn.disabled = false;
  updateBar();
}
